<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PULSAR</title>
<meta name="description" content="Зал совета агентов сети toot">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1a0830">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PULSAR">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #1a0830; }
  /* офис (Google Apps Script) открывается на весь экран внутри этой страницы */
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .splash { position: fixed; inset: 0; z-index: 2; background: radial-gradient(circle at 50% 40%, #4a1c7a, #1a0830 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #d4c0ee; transition: opacity .3s; padding: 24px; box-sizing: border-box; text-align: center; }
  .splash img { width: 120px; height: 120px; border-radius: 27px; box-shadow: 0 0 40px rgba(232, 194, 106, .35); }
  .splash a { color: #ff7a3d; }
  .gone { opacity: 0; pointer-events: none; }
  form { display: flex; flex-direction: column; gap: 10px; width: min(340px, 100%); }
  input { font: 16px system-ui, sans-serif; padding: 12px 14px; border-radius: 12px; border: 1px solid #e8c26a; background: #24103d; color: #f6ead0; }
  button { font: 600 15px system-ui, sans-serif; padding: 12px 14px; border-radius: 12px; border: 0; background: #FF5D19; color: #fff; cursor: pointer; }
  .hint { font-size: 13px; color: #a98fcf; }
</style>
</head>
<body>
<div class="splash" id="splash">
  <img src="icon-512.png" alt="PULSAR">
  <div id="msg">Загружаю…</div>
</div>
<script>
  // Адрес офиса. Сам код доступа здесь НЕ хранится — его вводят один раз, он остаётся только на этом устройстве.
  var OFFICE = 'https://script.google.com/macros/s/AKfycby8HNmi_PDGI8Pe58COHhGh6RUylK4udXWwv-PurbNdRNU5tbe04T7tRwRxI-qJ6YNd/exec';
  var KEY = 'pulsar-code';
  var splash = document.getElementById('splash'), msg = document.getElementById('msg');

  function readCode(text) {             // принимает и сам код, и целую личную ссылку с ?k=
    text = String(text || '').trim();
    var m = text.match(/[?&#]k=([A-Za-z0-9_-]+)/);
    if (m) return m[1];
    return /^[A-Za-z0-9_-]{8,}$/.test(text) ? text : '';
  }
  function getCode() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function setCode(c) { try { localStorage.setItem(KEY, c); } catch (e) {} }

  // ссылка вида …/toot-pulsar/#k=КОД — код берём из адреса (часть после # на сервер не уходит)
  var fromHash = readCode(location.hash);
  if (fromHash) setCode(fromHash);

  function start(code) {
    var app = document.createElement('iframe');
    app.title = 'PULSAR';
    app.allow = 'clipboard-write';
    app.src = OFFICE + '?k=' + encodeURIComponent(code);
    app.addEventListener('load', function () { splash.classList.add('gone'); });
    document.body.appendChild(app);
    setTimeout(function () {
      if (splash.classList.contains('gone')) return;
      msg.innerHTML = 'Долго грузится. Проверьте интернет или <a href="' + app.src + '">откройте напрямую</a>.';
    }, 20000);
  }

  function askCode() {
    msg.innerHTML = '<form id="f"><div>Первый вход на этом телефоне.<br>Вставьте вашу личную ссылку на офис или код доступа.</div>' +
      '<input id="c" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ссылка или код">' +
      '<button type="submit">Войти</button><div class="hint">Код запомнится только на этом устройстве.</div></form>';
    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      var c = readCode(document.getElementById('c').value);
      if (!c) { document.querySelector('.hint').textContent = 'Не похоже на ссылку или код — проверьте ещё раз.'; return; }
      setCode(c); msg.textContent = 'Загружаю…'; start(c);
    });
  }

  var code = getCode();
  if (code) start(code); else askCode();
</script>
</body>
</html>
